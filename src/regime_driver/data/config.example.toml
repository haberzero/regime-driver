# regime-driver 配置示例（config.example.toml）
#
# 用法：复制为 config.toml 后 `regime run "任务" --config config.toml`。
# 优先级（低→高）：默认值 < 配置文件 < 环境变量(REGIME_<字段>) < CLI 参数。
# 所有字段也可用环境变量 `REGIME_<大写字段名>` 覆盖，例如 REGIME_MODEL、REGIME_STALL_SEC。

# --- worker / 模型 ---
base_url = "http://127.0.0.1:4097"          # worker opencode server URL
model = "deepseek-api/deepseek-v4-flash"  # 所有 session 的模型（默认 DeepSeek 官方 API）
# 备选回退: my-opencode-go/deepseek-v4-flash（OpenCode Go）；需要 provider + key 见 docs/guide/04_environment.md
request_timeout = 600.0                      # 每个 message POST 的流式超时(秒)（慢 judge 需较大值）
max_driver_wait_sec = 3600.0                 # driver.run() 无显式 deadline 时的等待上限(秒)
session_hygiene_threshold = 100              # doctor 对累积 session 数的警告阈值
# session 自动清理策略（可自定义参考模型，默认关闭）。
# JSON 字符串；None/空 = 关闭。字段：
#   max_sessions  (int)  累积超过此值时清理到该值以下
#   min_age_sec   (int)  只清理存在超过该秒数的 session（0 = 不限）
#   only_idle     (bool) true 只清理 idle（默认，绝不删 busy）
# 用法：`regime sessions --cleanup '{"max_sessions": 100}' --perm clean`
# 或经 cron 周期性执行。字段说明见 docs/reference/02_configuration.md 的 session_cleanup_policy。
#session_cleanup_policy = '{"max_sessions": 100, "min_age_sec": 3600, "only_idle": true}'
agent_reviewer = "reviewer"                  # 审查者 agent 名

# --- 流程控制 ---
default_deadline_sec = 600                   # 每节点等待超时(秒)
human_confirm_timeout_sec = 300              # ask_human 人工确认等待超时(秒)
human_default_on_timeout = "block"           # ask_human 超时默认: block|advance|rework
poll_sec = 5.0                               # session 轮询间隔(秒)
max_reviewer_retries = 3                     # 审查者 gate 每节点重试（复杂判定偶尔输出散文，多给一次机会）
max_dialogue_rounds = 5                      # 审查者/开发者质询轮数上限
convergence_max_identical = 2                # 同一质询 N+ 次且汇报未变 -> 判打转
max_total_nodes = 50                         # 全局节点预算防 runaway
report_len_warn = 20000                      # agent 汇报长度(字符)超此值记 report_len_warn 审计
session_turn_check = 5                       # [deprecated] 死配置，无消费点

# --- 路径 ---
# ledger_path = "/tmp/regime.ledger.jsonl"    # JSONL 事件账本
# regime_path = "path/to/regime.json"          # 流程描述（默认打包版）
# skills_dir = "path/to/workflow-regime/skills"
# task_control_dir = "path/to/project"         # 任务控制文档目录

# --- skill ↔ 节点映射（默认 code_workflow）---
# 节点可在 regime.json 中声明 skill，运行时注入该节点的指令/提示词：
#   design  (reviewer judge) -> design-philosophy   # 方案设计的架构取舍方法论
#   implement (developer)    -> developer-quality   # 实现节点的卫生自查
#   test    (reviewer judge) -> code-review         # 审查门的方法论
#   wrap    (developer)      -> developer-quality   # 收尾交付自查
# 自定义 flow 可为任意节点挂任意已部署 skill（scaffold 部署的是 data/skills 全集）。

# --- 监控 / 看门狗（可编程策略引擎）---
# 活性信号 = opencode SSE 事件流（message.part.delta 等即时推送），非 token 计数
# （session_tokens 是 step 粒度记账，单步长思考期间恒 0，不能判活性）。
monitor_enabled = true                       # [deprecated] 纯兼容保留，无消费点；看门狗由根不变量 I1 强制常在线
monitor_poll_sec = 3.0                       # [deprecated] 原无消费点
stall_sec = 180                              # busy 且无 SSE 活性超过此秒 -> 判卡死（180s 为长思考/突发流式留裕量；同时是策略看门狗默认 kill 阈值）
on_stall = "abort"                           # [deprecated] 原死配置，看门狗动作由 watchdog_policy_json 决定
# 可编程看门狗策略：空=默认策略（stall_sec -> kill）
# soft_sec 超时 -> soft_action（默认 interrupt=PAUSE 中断当前生成+冻结推进，等待自动恢复）
# meta_gate_soft=true 时该动作需智能判定确认；hard_sec 兜底 kill。
watchdog_policy_json = null                  # 例: '{"soft_sec":30,"soft_action":"interrupt","meta_gate_soft":true,"hard_sec":600}'
auto_resume_sec = 30                         # 被中断(paused)的会话超此秒自动 RESUME 注入"继续"续接；仍无活性才兜底 kill

# --- 元分析（进程外 supervisor --meta / drive --meta 的智能判verdict）---
meta_analyze_enabled = false                 # 默认关；开则独立模型判停滞（确定性门兜底）
meta_model = "deepseek-api/deepseek-v4-flash"# 元分析模型
meta_max_context_msgs = 20                   # 喂给元分析的会话最近消息数

# --- 一键自驱动栈（regime drive）---
# deadline 用 --deadline <sec>（全局期限，执行器+supervisor 共享）
# 容器名用 --container <name>（T1 失联时 L4 docker restart 的对象）
# 报告单一真源用 --reporter <journal>；受监管任务进 TaskRegistry（regime task / report --tasks-dir）
# 并发隔离用 --workspace <ws>（每工作区一个 opencode 实例，见 docs/subsystems/02_worker_isolation.md）

# --- 多 opencode 实例工作区隔离（regime worker）---
# 环境变量：REGIME_WORKSPACE_ROOT（默认 ~/.regime/workspaces）、REGIME_WORKER_PORT_BASE（默认 4200）、
#           REGIME_WORKER_IMAGE（默认 opencode-worker:1.18.11）
# 密钥：DEEPSEEK_API_KEY 或 ~/.regime/keys/deepseek.key

# --- 权限门禁 ---
# permission_ceiling = "clean"                # 写操作权限硬上限 read<interact<run<clean
#                                             # 也读 REGIME_PERMISSION_CEILING。
#                                             # 注意：本地 CLI 中此上限由进程环境控制，
#                                             # 任何能控制进程环境者可自行设 clean（本地
#                                             # CLI 无法做到进程级不可绕过），详见 TECH_DEBT G5。

# --- session 生命周期 ---
context_limit_tokens = 120_000               # session token 上限（算用量分数）
# context_handover_policy_json：上下文预算交接策略（默认 None=关闭，走各角色 RolePolicy 阈值）
#   当会话上下文使用率到达 soft_fraction 时询问该会话"自检预算 + 是否同会话续进"；
#   到达 hard_fraction 时强制交接（换新会话+真实交接文档）。
#   例：'{"enabled": true, "soft_fraction": 0.5, "hard_fraction": 0.7,
#        "min_continue_nodes": 2, "handover_keep_messages": 30}'
context_handover_policy_json = None

# --- 运行验证（judge 节点的 verify 命令）---
worker_container = "opencode-worker"         # worker docker 容器名（verify/chaos/L4 用；{container} 占位符）
verify_enabled = false                       # 是否执行 judge 节点的 verify 宿主命令（opt-in；preflight/离线自动关闭）

# --- 日志 ---
log_level = "info"                           # debug | info | warning | error
# --- 控制对话框（regime dialog）---
dialog_talk_timeout_sec = 120.0              # dialog talk 命令等待回复上限(秒)，长生成为主，可配
