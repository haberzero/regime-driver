[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regime-driver"
dynamic = ["version"]
description = "institutional-process robot: compile workflow-regime into a state machine and drive a clean opencode worker."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "oc-meta" }]
keywords = ["opencode", "agent", "workflow", "state-machine", "oa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "hatchling"]

[project.scripts]
regime = "regime_driver.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_driver"]

[tool.hatch.version]
source = "code"
path = "src/regime_driver/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dedicated basetemp: the default (/tmp/pytest-of-haber) can accumulate
# root-owned remnants from real-worker E2E (docker-created files a normal user
# cannot remove), producing rm_rf PermissionError warnings on every run. E2E is
# now a SEPARATE suite under e2e_tests/ (never collected here), so a fresh
# basetemp keeps the unit run warning-free and fast.
addopts = "-q --basetemp=/tmp/pytest-of-regime"
markers = [
    "e2e: end-to-end tests requiring a live worker container",
]

[tool.coverage.run]
source = ["regime_driver"]
omit = ["*/testing/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Coverage floor ~ current actual (70%) with a small safety margin against
# CI-matrix flakiness (py3.11 vs 3.12 branch coverage). Honest regression
# baseline (WORK_PLAN5 C1). Raise it as coverage improves; never silently drop.
fail_under = 68

[tool.hatch.build.targets.sdist]
include = ["src/regime_driver", "README.md", "pyproject.toml"]