name: docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

# Deploy the MkDocs site to GitHub Pages (Read the Docs theme).
# Pages source must be set to "GitHub Actions" (Settings → Pages → Source).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install MkDocs + Read the Docs theme + mermaid2
        run: pip install mkdocs 'mkdocs-mermaid2-plugin==1.2.3'
      - name: Build site
        # NOTE: `--strict` not used because docs/README.md (the repo-level doc
        # map) legitimately shares a basename with index.md (the portal home);
        # MkDocs excludes README.md from the site, which is intended.
        run: mkdocs build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
