name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest --cov=regime_driver --cov-report=term-missing
      - name: Coverage gate
        run: |
          pytest --cov=regime_driver --cov-report=term --cov-fail-under=80
        continue-on-error: true  # informational gate; uncomment to enforce