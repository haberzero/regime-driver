name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (don't burn CI minutes on old commits).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # test — offline unit tests + coverage gate (the regression gate). No worker,
  # no Docker, no model key needed. This is the job that MUST always be green.
  #
  # NOTE: real-worker E2E (`e2e_tests/test_e2e_worker.py`, gated by REGIME_E2E=1)
  # is ARCHIVED for CI as of 2026-08-11 — the OPENCODE_GO_API_KEY GitHub secret
  # is not planned for the foreseeable future, so the job would only ever
  # no-op. The E2E tests remain usable locally (see e2e_tests/test_e2e_worker.py).
  # --------------------------------------------------------------------------
  test:
    name: unit · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Offline CLI smoke (no worker)
        run: |
          regime validate --json
          regime preflight --json
      - name: Setup/scaffold assembly smoke (no worker)
        run: |
          # guided install must assemble the A-route carrier (plugin/agent/opencode.json)
          regime setup --target /tmp/ci-opencode --json | tee /tmp/setup.json
          test -f /tmp/ci-opencode/plugins/regime-dialog-control.js
          test -f /tmp/ci-opencode/agents/dialog-control.md
          test -f /tmp/ci-opencode/opencode.json
          test -f /tmp/ci-opencode/package.json
          # wheel must NOT carry docker build assets (pip-only hygiene)
          python -m pip wheel . --no-deps -w /tmp/ci-wheel -q
          python - <<'PY'
          import zipfile, glob
          w = glob.glob('/tmp/ci-wheel/*.whl')[0]
          with zipfile.ZipFile(w) as z:
              bad = [n for n in z.namelist() if '/data/docker/' in n or 'Dockerfile' in n]
          assert not bad, f"wheel must not contain docker assets: {bad}"
          print("wheel docker-asset hygiene OK")
          PY
      - name: Unit tests + coverage gate
        run: |
          set +e
          pytest --cov=regime_driver --cov-report=term --cov-fail-under=68 2>&1 | tee /tmp/pytest.out
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # surface failing test names + assertion/error lines as read-only
            # annotations (diagnosable via the API without log download).
            echo "::error::PYTEST_FAILED exit=$rc"
            grep -nE "FAILED|ERROR|short test summary|AssertionError|^E +|Failed:" /tmp/pytest.out \
              | sed 's/^/::error::/'
            exit $rc
          fi
