name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (don't burn CI minutes on old commits).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # test — offline unit tests + coverage gate (the regression gate). No worker,
  # no Docker, no model key needed. This is the job that MUST always be green.
  # --------------------------------------------------------------------------
  test:
    name: unit · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Offline CLI smoke (no worker)
        run: |
          regime validate --json
          regime preflight --json
      - name: Unit tests + coverage gate
        run: |
          set +e
          pytest --cov=regime_driver --cov-report=term --cov-fail-under=68 2>&1 | tee /tmp/pytest.out
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # surface failing test names + assertion/error lines as read-only
            # annotations (diagnosable via the API without log download).
            echo "::error::PYTEST_FAILED exit=$rc"
            grep -nE "FAILED|ERROR|short test summary|AssertionError|^E +|Failed:" /tmp/pytest.out \
              | sed 's/^/::error::/'
            exit $rc
          fi

  # --------------------------------------------------------------------------
  # e2e-real — drive a REAL opencode worker over HTTP so the execution chain
  # cannot silently drift. Requires a working model key as a GitHub secret.
  # The default model is `my-opencode-go/deepseek-v4-flash` (OpenCode Go), so the
  # worker MUST be given OPENCODE_GO_API_KEY.
  #
  # NOTE: the `secrets` context is NOT allowed in a job-level `if`, so we inject
  # the key via job-level `env` and gate each expensive step with `if: env.KEY`
  # (the `env` context IS allowed in step `if`). Without the secret the job runs
  # but the docker/e2e steps are skipped (no failure), instead of rejecting the
  # whole workflow.
  # --------------------------------------------------------------------------
  e2e-real:
    name: real-worker E2E
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build base image (self-contained, committed recipe)
        if: ${{ env.OPENCODE_GO_API_KEY != '' }}
        run: docker build -f docker/Dockerfile.mvp -t opencode-mvp:1.18.11 .
      - name: Build worker image
        if: ${{ env.OPENCODE_GO_API_KEY != '' }}
        run: docker build -f docker/Dockerfile.worker -t opencode-worker:1.18.11 .
      - name: Start worker container
        if: ${{ env.OPENCODE_GO_API_KEY != '' }}
        run: |
          docker run -d --name opencode-worker -p 4097:4097 \
            -e OPENCODE_GO_API_KEY="$OPENCODE_GO_API_KEY" \
            opencode-worker:1.18.11
      - name: Wait for worker health
        if: ${{ env.OPENCODE_GO_API_KEY != '' }}
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4097/global/health >/dev/null; then
              echo "worker healthy"; exit 0
            fi
            sleep 2
          done
          echo "worker never became healthy" >&2
          docker logs --tail 50 opencode-worker >&2
          exit 1
      - name: Run real E2E
        if: ${{ env.OPENCODE_GO_API_KEY != '' }}
        env:
          REGIME_E2E: "1"
          REGIME_E2E_BASE: "http://127.0.0.1:4097"
        run: pytest tests/test_e2e_worker.py -q
      - name: Cleanup
        if: always()
        run: docker rm -f opencode-worker >/dev/null 2>&1 || true
