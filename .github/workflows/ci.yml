name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Run unit tests (no real worker)
        run: |
          pytest --cov=regime_driver --cov-report=term-missing
      - name: Coverage gate
        # Floor ~ actual baseline (70%) with a small safety margin vs matrix
        # flakiness, WORK_PLAN5 C1. Raise over time.
        run: |
          pytest --cov=regime_driver --cov-report=term --cov-fail-under=68

  # Real-worker E2E regression gate (P1#4): builds the worker container and drives
  # a REAL opencode worker over HTTP, so the execution chain cannot silently drift.
  # Requires the DEEPSEEK_API_KEY secret (a working model key). The disruptive
  # container-restart E2E (REGIME_E2E_RESTART) is intentionally NOT run here.
  e2e-real:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Build worker image
        run: |
          docker build -f docker/Dockerfile.worker -t opencode-worker:1.18.11 .
      - name: Start worker container
        run: |
          docker run -d --name opencode-worker -p 4097:4097 \
            -e DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }} \
            opencode-worker:1.18.11
      - name: Wait for worker health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4097/global/health >/dev/null; then
              echo "worker healthy"; exit 0
            fi
            sleep 2
          done
          echo "worker never became healthy" >&2
          docker logs --tail 50 opencode-worker >&2
          exit 1
      - name: Run real E2E
        env:
          REGIME_E2E: "1"
          REGIME_E2E_BASE: "http://127.0.0.1:4097"
        run: |
          pytest tests/test_e2e_worker.py -q
      - name: Cleanup
        if: always()
        run: |
          docker rm -f opencode-worker >/dev/null 2>&1 || true
